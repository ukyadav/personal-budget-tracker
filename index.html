<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Personal Budget Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .modal{background:rgba(15,23,42,.58)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="bg-slate-50 text-slate-900">
<div id="app"></div>
<script>
(() => {
  const KEY='budgetTrackerDataV2';
  const CATEGORIES=['Groceries','Dining Out','Shopping','Entertainment','Subscriptions','Gas','Utilities','Transportation','Health','Childcare','Other'];
  const MEMBERS=['me','spouse','joint'];
  const today=new Date();
  const state={tab:'dashboard',dark:false,currentMonth:new Date(today.getFullYear(),today.getMonth(),1),member:'all',modal:null,data:null};
  const uid=()=>Date.now()+Math.floor(Math.random()*10000);
  const iso=d=>new Date(d).toISOString().slice(0,10);
  const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0);
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const monthKey=d=>`${new Date(d).getFullYear()}-${String(new Date(d).getMonth()+1).padStart(2,'0')}`;
  const currentKey=()=>monthKey(state.currentMonth);
  const demo=()=>({
    income:[{id:uid(),source:'Salary',amount:5000,date:iso(new Date(today.getFullYear(),today.getMonth(),1)),frequency:'Monthly'},{id:uid(),source:'Side Income',amount:500,date:iso(new Date(today.getFullYear(),today.getMonth(),5)),frequency:'Monthly'}],
    expenses:[
      ['Groceries',320,3,'Groceries','Debit','joint'],['Gas',65,4,'Gas','Debit','joint'],['Lunch',28,5,'Dining Out','Credit','me'],['Gym',50,6,'Subscriptions','Debit','me'],['Groceries',280,10,'Groceries','Debit','joint'],['Dinner Out',85,12,'Dining Out','Credit','me'],['Shopping',120,14,'Shopping','Credit','spouse'],['Netflix',16.99,15,'Subscriptions','Debit','joint'],['Movies',35,16,'Entertainment','Credit','me'],['Groceries',310,17,'Groceries','Debit','joint']
    ].map((x,i)=>({id:uid()+i,description:x[0],amount:x[1],date:iso(new Date(today.getFullYear(),today.getMonth(),x[2])),category:x[3],method:x[4],member:x[5]})),
    bills:[{id:uid(),name:'Rent',amount:1800,dueDate:1,paid:true},{id:uid()+1,name:'Internet',amount:89.99,dueDate:5,paid:true},{id:uid()+2,name:'Phone',amount:79.99,dueDate:10,paid:false},{id:uid()+3,name:'Insurance',amount:145,dueDate:15,paid:false},{id:uid()+4,name:'Utilities',amount:120,dueDate:20,paid:false}],
    goals:[{id:uid(),name:'Emergency Fund',target:10000,current:7250,targetDate:iso(new Date(today.getFullYear()+1,0,1))},{id:uid()+1,name:'Vacation',target:5000,current:2100,targetDate:iso(new Date(today.getFullYear(),today.getMonth()+6,1))}],
    budgets:{Groceries:700,'Dining Out':250,Shopping:300,Entertainment:150,Subscriptions:100,Gas:200,Utilities:150}
  });
  function load(){try{state.data=JSON.parse(localStorage.getItem(KEY))||demo()}catch{state.data=demo()} save();}
  function save(){localStorage.setItem(KEY,JSON.stringify(state.data));}
  function monthItems(arr){return arr.filter(x=>monthKey(x.date)===currentKey());}
  function calc(){
    const inc=monthItems(state.data.income).reduce((s,x)=>s+Number(x.amount),0);
    const exps=monthItems(state.data.expenses);
    const exp=exps.reduce((s,x)=>s+Number(x.amount),0);
    const bills=state.data.bills.reduce((s,x)=>s+Number(x.amount),0);
    const remaining=inc-exp-bills;
    const saved=Math.max(0,remaining);
    const savingsRate=inc? saved/inc*100:0;
    const used={}; exps.forEach(x=>used[x.category]=(used[x.category]||0)+Number(x.amount));
    const budgetTotal=Object.values(state.data.budgets).reduce((s,x)=>s+Number(x),0);
    const budgetSpent=Object.values(used).reduce((s,x)=>s+x,0);
    return {inc,exps,exp,bills,remaining,saved,savingsRate,used,budgetTotal,budgetSpent,totalGoals:state.data.goals.reduce((s,g)=>s+Number(g.current),0)};
  }
  const card=(label,value,sub='')=>`<div class="rounded-xl border p-5 ${state.dark?'bg-slate-800 border-slate-700':'bg-white border-slate-200'}"><div class="text-sm ${state.dark?'text-slate-400':'text-slate-500'}">${label}</div><div class="text-2xl font-bold mt-2">${value}</div>${sub?`<div class="text-xs mt-2 ${state.dark?'text-slate-400':'text-slate-500'}">${sub}</div>`:''}</div>`;
  function progress(v,max){const p=max?Math.max(0,v/max*100):0; const cls=p>=100?'bg-red-500':p>=80?'bg-amber-500':'bg-emerald-500';return `<div class="h-2 rounded-full overflow-hidden ${state.dark?'bg-slate-700':'bg-slate-200'}"><div class="h-full ${cls}" style="width:${Math.min(100,p)}%"></div></div>`}
  function dashboard(){const c=calc();return `<div class="space-y-6"><div class="grid md:grid-cols-3 gap-4">${card('Monthly Income',money(c.inc))}${card('Expenses',money(c.exp))}${card('Remaining',money(c.remaining),c.remaining>=0?'Available after expenses and bills':'Spending exceeds income')}</div><div class="grid md:grid-cols-3 gap-4">${card('Monthly Bills',money(c.bills))}${card('Savings Rate',c.savingsRate.toFixed(1)+'%','Based on this month’s remaining cash')}${card('Saved Toward Goals',money(c.totalGoals))}</div><section class="rounded-xl border p-5 ${state.dark?'bg-slate-800 border-slate-700':'bg-white'}"><div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Monthly Budget</h2><button data-action="budget" class="text-blue-500 text-sm">Edit budgets</button></div><div class="flex justify-between text-sm mb-2"><span>${money(c.budgetSpent)} spent</span><span>${money(c.budgetTotal)} limit</span></div>${progress(c.budgetSpent,c.budgetTotal)}<div class="mt-2 text-sm ${c.budgetTotal-c.budgetSpent>=0?'text-emerald-500':'text-red-500'}">${money(c.budgetTotal-c.budgetSpent)} remaining</div></section><div class="grid md:grid-cols-2 gap-4"><button data-action="addExpense" class="rounded-xl bg-blue-600 hover:bg-blue-700 text-white p-4 font-semibold">+ Add Expense</button><button data-action="addIncome" class="rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white p-4 font-semibold">+ Add Income</button></div></div>`}
  function transactions(){let xs=calc().exps.filter(x=>state.member==='all'||x.member===state.member).sort((a,b)=>b.date.localeCompare(a.date));return `<div><div class="flex flex-wrap gap-2 mb-4">${['all',...MEMBERS].map(m=>`<button data-member="${m}" class="px-4 py-2 rounded-lg text-sm ${state.member===m?'bg-blue-600 text-white':state.dark?'bg-slate-700':'bg-slate-200'}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}<button data-action="addExpense" class="ml-auto px-4 py-2 rounded-lg bg-blue-600 text-white">+ Expense</button></div><div class="rounded-xl border overflow-hidden ${state.dark?'border-slate-700 bg-slate-800':'bg-white'}">${xs.length?xs.map(x=>`<div class="p-4 border-b last:border-b-0 ${state.dark?'border-slate-700':'border-slate-200'} flex gap-3 items-center"><div class="flex-1"><div class="font-semibold">${esc(x.description)}</div><div class="text-sm opacity-60">${esc(x.category)} • ${esc(x.date)} • ${esc(x.member)}</div></div><div class="font-semibold">-${money(x.amount)}</div><button data-edit-expense="${x.id}" class="text-blue-500">Edit</button><button data-delete-expense="${x.id}" class="text-red-500">Delete</button></div>`).join(''):`<div class="p-8 text-center opacity-60">No expenses for this month.</div>`}</div></div>`}
  function budget(){const c=calc();return `<div class="space-y-4"><div class="flex justify-end"><button data-action="editBudgets" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Edit Budget Limits</button></div>${Object.entries(state.data.budgets).map(([k,v])=>{const s=c.used[k]||0;return `<div class="rounded-xl border p-5 ${state.dark?'bg-slate-800 border-slate-700':'bg-white'}"><div class="flex justify-between mb-3"><b>${esc(k)}</b><span>${money(s)} / ${money(v)}</span></div>${progress(s,v)}<div class="text-sm mt-2 ${s>v?'text-red-500':'text-emerald-500'}">${s>v?money(s-v)+' over':money(v-s)+' left'}</div></div>`}).join('')}</div>`}
  function savings(){return `<div class="space-y-4"><div class="flex justify-end"><button data-action="addGoal" class="px-4 py-2 bg-blue-600 text-white rounded-lg">+ Savings Goal</button></div>${state.data.goals.map(g=>`<div class="rounded-xl border p-5 ${state.dark?'bg-slate-800 border-slate-700':'bg-white'}"><div class="flex justify-between"><div><b>${esc(g.name)}</b><div class="text-sm opacity-60">Target ${esc(g.targetDate)}</div></div><div class="font-bold">${g.target?Math.round(g.current/g.target*100):0}%</div></div><div class="my-4">${progress(g.current,g.target)}</div><div class="flex justify-between text-sm"><span>${money(g.current)} saved</span><span>${money(Math.max(0,g.target-g.current))} remaining</span></div><div class="flex gap-3 mt-4"><button data-edit-goal="${g.id}" class="text-blue-500">Edit</button><button data-delete-goal="${g.id}" class="text-red-500">Delete</button></div></div>`).join('')||'<div class="text-center p-8 opacity-60">No savings goals.</div>'}</div>`}
  function analytics(){const c=calc(), rows=Object.entries(c.used).sort((a,b)=>b[1]-a[1]);return `<div class="rounded-xl border p-5 ${state.dark?'bg-slate-800 border-slate-700':'bg-white'}"><h2 class="font-bold text-lg mb-5">Spending by Category</h2>${rows.length?rows.map(([k,v])=>`<div class="mb-4"><div class="flex justify-between text-sm mb-1"><span>${esc(k)}</span><b>${money(v)}</b></div>${progress(v,Math.max(...rows.map(x=>x[1])))}</div>`).join(''):'<div class="opacity-60">No spending data this month.</div>'}</div>`}
  function settings(){return `<div class="max-w-2xl space-y-4"><section class="rounded-xl border p-5 ${state.dark?'bg-slate-800 border-slate-700':'bg-white'}"><h2 class="font-bold mb-4">Appearance</h2><button data-action="dark" class="px-4 py-2 rounded-lg ${state.dark?'bg-slate-700':'bg-slate-200'}">${state.dark?'Use Light Mode':'Use Dark Mode'}</button></section><section class="rounded-xl border p-5 ${state.dark?'bg-slate-800 border-slate-700':'bg-white'}"><h2 class="font-bold mb-4">Data</h2><div class="grid sm:grid-cols-2 gap-3"><button data-action="export" class="px-4 py-2 rounded-lg bg-blue-600 text-white">Export Backup</button><label class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-center cursor-pointer">Import Backup<input id="importFile" type="file" accept="application/json" class="hidden"></label><button data-action="reset" class="px-4 py-2 rounded-lg bg-red-600 text-white sm:col-span-2">Reset to Demo Data</button></div><p class="text-xs opacity-60 mt-3">Data is stored only in this browser using localStorage.</p></section></div>`}
  function modal(){if(!state.modal)return''; const m=state.modal; let body='';
    if(m.type==='expense'){const x=m.item||{};body=`${field('Description','description',x.description)}${field('Amount','amount',x.amount,'number')}${field('Date','date',x.date||iso(new Date()),'date')}${select('Category','category',CATEGORIES,x.category)}${select('Payment Method','method',['Debit','Credit','Cash','Other'],x.method)}${select('Household Member','member',MEMBERS,x.member||'joint')}`}
    if(m.type==='income'){const x=m.item||{};body=`${field('Source','source',x.source)}${field('Amount','amount',x.amount,'number')}${field('Date','date',x.date||iso(new Date()),'date')}`}
    if(m.type==='goal'){const x=m.item||{};body=`${field('Goal Name','name',x.name)}${field('Target Amount','target',x.target,'number')}${field('Current Saved','current',x.current,'number')}${field('Target Date','targetDate',x.targetDate||iso(new Date(today.getFullYear()+1,today.getMonth(),today.getDate())),'date')}`}
    if(m.type==='budgets')body=CATEGORIES.map(c=>field(c,c,state.data.budgets[c]||0,'number')).join('');
    return `<div class="fixed inset-0 z-[100] modal flex items-center justify-center p-4"><form id="modalForm" class="w-full max-w-lg max-h-[90vh] overflow-auto rounded-xl p-6 ${state.dark?'bg-slate-800 text-white':'bg-white text-slate-900'}"><div class="flex justify-between mb-5"><h2 class="text-xl font-bold">${esc(m.title)}</h2><button type="button" data-action="close">✕</button></div>${body}<div class="flex gap-3 mt-5"><button type="button" data-action="close" class="flex-1 py-2 rounded-lg ${state.dark?'bg-slate-700':'bg-slate-200'}">Cancel</button><button class="flex-1 py-2 rounded-lg bg-blue-600 text-white">Save</button></div></form></div>`}
  function field(label,name,value='',type='text'){return `<label class="block mb-3"><span class="text-sm font-medium">${esc(label)}</span><input required name="${esc(name)}" type="${type}" step="${type==='number'?'0.01':''}" value="${esc(value)}" class="mt-1 w-full px-3 py-2 rounded-lg border bg-transparent ${state.dark?'border-slate-600':'border-slate-300'}"></label>`}
  function select(label,name,opts,value){return `<label class="block mb-3"><span class="text-sm font-medium">${esc(label)}</span><select name="${name}" class="mt-1 w-full px-3 py-2 rounded-lg border ${state.dark?'bg-slate-800 border-slate-600':'bg-white border-slate-300'}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}
  function render(){document.body.className=state.dark?'bg-slate-900 text-slate-100':'bg-slate-50 text-slate-900'; const tabs=[['dashboard','Dashboard'],['transactions','Transactions'],['budget','Budget'],['savings','Savings'],['analytics','Analytics'],['settings','Settings']]; const views={dashboard,transactions,budget,savings,analytics,settings}; document.getElementById('app').innerHTML=`<header class="sticky top-0 z-40 border-b ${state.dark?'bg-slate-800 border-slate-700':'bg-white border-slate-200'}"><div class="max-w-7xl mx-auto p-4"><div class="flex justify-between items-center"><h1 class="text-2xl font-bold">💰 Budget Tracker</h1><button data-action="dark" class="p-2 rounded-lg ${state.dark?'bg-slate-700':'bg-slate-100'}">${state.dark?'☀️':'🌙'}</button></div><nav class="flex gap-1 overflow-x-auto mt-4">${tabs.map(([id,l])=>`<button data-tab="${id}" class="px-4 py-2 rounded-lg whitespace-nowrap text-sm font-medium ${state.tab===id?'bg-blue-600 text-white':state.dark?'hover:bg-slate-700':'hover:bg-slate-100'}">${l}</button>`).join('')}</nav></div></header>${state.tab!=='settings'?`<div class="border-b ${state.dark?'bg-slate-800 border-slate-700':'bg-white'}"><div class="max-w-7xl mx-auto p-3 flex justify-center items-center gap-5"><button data-action="prev">←</button><b class="min-w-[190px] text-center">${state.currentMonth.toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</b><button data-action="next">→</button></div></div>`:''}<main class="max-w-7xl mx-auto p-4 md:py-8">${views[state.tab]()}</main>${modal()}`; bind();}
  function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>{state.member=b.dataset.member;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-delete-expense]').forEach(b=>b.onclick=()=>{if(confirm('Delete this expense?')){state.data.expenses=state.data.expenses.filter(x=>x.id!=b.dataset.deleteExpense);save();render()}});document.querySelectorAll('[data-edit-expense]').forEach(b=>b.onclick=()=>{const x=state.data.expenses.find(x=>x.id==b.dataset.editExpense);state.modal={type:'expense',title:'Edit Expense',item:x};render()});document.querySelectorAll('[data-edit-goal]').forEach(b=>b.onclick=()=>{state.modal={type:'goal',title:'Edit Savings Goal',item:state.data.goals.find(x=>x.id==b.dataset.editGoal)};render()});document.querySelectorAll('[data-delete-goal]').forEach(b=>b.onclick=()=>{if(confirm('Delete this savings goal?')){state.data.goals=state.data.goals.filter(x=>x.id!=b.dataset.deleteGoal);save();render()}});const f=document.getElementById('modalForm');if(f)f.onsubmit=submitModal;const imp=document.getElementById('importFile');if(imp)imp.onchange=importData;}
  function action(a){if(a==='dark'){state.dark=!state.dark;render()}else if(a==='prev'){state.currentMonth=new Date(state.currentMonth.getFullYear(),state.currentMonth.getMonth()-1,1);render()}else if(a==='next'){state.currentMonth=new Date(state.currentMonth.getFullYear(),state.currentMonth.getMonth()+1,1);render()}else if(a==='close'){state.modal=null;render()}else if(a==='addExpense'){state.modal={type:'expense',title:'Add Expense'};render()}else if(a==='addIncome'){state.modal={type:'income',title:'Add Income'};render()}else if(a==='addGoal'){state.modal={type:'goal',title:'Add Savings Goal'};render()}else if(a==='editBudgets'||a==='budget'){state.modal={type:'budgets',title:'Edit Monthly Budgets'};render()}else if(a==='export'){const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download=`budget-backup-${iso(new Date())}.json`;el.click();setTimeout(()=>URL.revokeObjectURL(url),500)}else if(a==='reset'){if(confirm('Reset all data to demo data?')){state.data=demo();save();render()}}}
  function submitModal(e){e.preventDefault();const fd=Object.fromEntries(new FormData(e.target).entries()),m=state.modal;if(m.type==='expense'){const obj={id:m.item?.id||uid(),description:fd.description,amount:Number(fd.amount),date:fd.date,category:fd.category,method:fd.method,member:fd.member};state.data.expenses=m.item?state.data.expenses.map(x=>x.id===m.item.id?obj:x):[...state.data.expenses,obj]}else if(m.type==='income'){state.data.income.push({id:uid(),source:fd.source,amount:Number(fd.amount),date:fd.date,frequency:'Monthly'})}else if(m.type==='goal'){const obj={id:m.item?.id||uid(),name:fd.name,target:Number(fd.target),current:Number(fd.current),targetDate:fd.targetDate};state.data.goals=m.item?state.data.goals.map(x=>x.id===m.item.id?obj:x):[...state.data.goals,obj]}else if(m.type==='budgets'){CATEGORIES.forEach(c=>state.data.budgets[c]=Number(fd[c]||0))}save();state.modal=null;render();}
  function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.income||!d.expenses||!d.bills||!d.goals||!d.budgets)throw 0;state.data=d;save();render();alert('Backup imported successfully.')}catch{alert('Invalid backup file.')}};r.readAsText(file)}
  load(); render();
})();
</script>
</body>
</html>
