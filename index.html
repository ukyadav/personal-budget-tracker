<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Personal Budget Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-bg-light: #f8fafc;
            --color-bg-dark: #0f172a;
            --color-surface-light: #ffffff;
            --color-surface-dark: #1e293b;
            --color-text-light: #0f172a;
            --color-text-dark: #f1f5f9;
            --color-border-light: #e2e8f0;
            --color-border-dark: #334155;
            --color-primary: #3b82f6;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .app-light {
            background-color: var(--color-bg-light);
            color: var(--color-text-light);
        }

        .app-dark {
            background-color: var(--color-bg-dark);
            color: var(--color-text-dark);
        }

        .card-light {
            background-color: var(--color-surface-light);
            border-color: var(--color-border-light);
        }

        .card-dark {
            background-color: var(--color-surface-dark);
            border-color: var(--color-border-dark);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const BudgetTrackerApp = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [darkMode, setDarkMode] = useState(false);
            const [currency] = useState('CAD');
            const [income, setIncome] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [bills, setBills] = useState([]);
            const [savingsGoals, setSavingsGoals] = useState([]);
            const [budgets, setBudgets] = useState({});
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [householdMember, setHouseholdMember] = useState('all');
            const [isHydrated, setIsHydrated] = useState(false);

            const loadDemoData = () => {
                const today = new Date();
                const year = today.getFullYear();
                const month = today.getMonth();

                setIncome([
                    { id: 1, source: 'Salary', amount: 5000, date: new Date(year, month, 1), frequency: 'Monthly' },
                    { id: 2, source: 'Side Income', amount: 500, date: new Date(year, month, 5), frequency: 'Monthly' }
                ]);

                setExpenses([
                    { id: 1, description: 'Groceries', amount: 320, date: new Date(year, month, 3), category: 'Groceries', method: 'Debit', recurring: false, member: 'joint' },
                    { id: 2, description: 'Gas', amount: 65, date: new Date(year, month, 4), category: 'Gas', method: 'Debit', recurring: false, member: 'joint' },
                    { id: 3, description: 'Lunch', amount: 28, date: new Date(year, month, 5), category: 'Dining Out', method: 'Credit', recurring: false, member: 'me' },
                    { id: 4, description: 'Gym', amount: 50, date: new Date(year, month, 6), category: 'Subscriptions', method: 'Debit', recurring: true, member: 'me' },
                    { id: 5, description: 'Groceries', amount: 280, date: new Date(year, month, 10), category: 'Groceries', method: 'Debit', recurring: false, member: 'joint' },
                    { id: 6, description: 'Dinner Out', amount: 85, date: new Date(year, month, 12), category: 'Dining Out', method: 'Credit', recurring: false, member: 'me' },
                    { id: 7, description: 'Shopping', amount: 120, date: new Date(year, month, 14), category: 'Shopping', method: 'Credit', recurring: false, member: 'spouse' },
                    { id: 8, description: 'Netflix', amount: 16.99, date: new Date(year, month, 15), category: 'Subscriptions', method: 'Debit', recurring: true, member: 'joint' },
                    { id: 9, description: 'Movies', amount: 35, date: new Date(year, month, 16), category: 'Entertainment', method: 'Credit', recurring: false, member: 'me' },
                    { id: 10, description: 'Groceries', amount: 310, date: new Date(year, month, 17), category: 'Groceries', method: 'Debit', recurring: false, member: 'joint' }
                ]);

                setBills([
                    { id: 1, name: 'Rent', amount: 1800, dueDate: 1, frequency: 'Monthly', autoPay: true, paid: true },
                    { id: 2, name: 'Internet', amount: 89.99, dueDate: 5, frequency: 'Monthly', autoPay: true, paid: true },
                    { id: 3, name: 'Phone', amount: 79.99, dueDate: 10, frequency: 'Monthly', autoPay: true, paid: false },
                    { id: 4, name: 'Insurance', amount: 145, dueDate: 15, frequency: 'Monthly', autoPay: true, paid: false },
                    { id: 5, name: 'Utilities', amount: 120, dueDate: 20, frequency: 'Monthly', autoPay: false, paid: false }
                ]);

                setSavingsGoals([
                    { id: 1, name: 'Emergency Fund', target: 10000, current: 7250, targetDate: new Date(year + 1, 0, 1) },
                    { id: 2, name: 'Vacation', target: 5000, current: 2100, targetDate: new Date(year, month + 6, 1) },
                    { id: 3, name: 'Car Down Payment', target: 20000, current: 8500, targetDate: new Date(year + 2, 0, 1) }
                ]);

                setBudgets({
                    'Groceries': 700,
                    'Dining Out': 250,
                    'Shopping': 300,
                    'Entertainment': 150,
                    'Subscriptions': 100,
                    'Gas': 200,
                    'Utilities': 150
                });
                setIsHydrated(true);
            };

            useEffect(() => {
                const savedData = localStorage.getItem('budgetTrackerData');
                if (savedData) {
                    try {
                        const data = JSON.parse(savedData);
                        setIncome(data.income || []);
                        setExpenses(data.expenses || []);
                        setBills(data.bills || []);
                        setSavingsGoals(data.savingsGoals || []);
                        setBudgets(data.budgets || {});
                        setIsHydrated(true);
                    } catch (e) {
                        loadDemoData();
                    }
                } else {
                    loadDemoData();
                }
            }, []);

            useEffect(() => {
                if (!isHydrated) return;
                localStorage.setItem('budgetTrackerData', JSON.stringify({ income, expenses, bills, savingsGoals, budgets }));
            }, [income, expenses, bills, savingsGoals, budgets, isHydrated]);

            const monthStart = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
            const monthEnd = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);

            const monthlyIncome = income.reduce((sum, inc) => sum + Number(inc.amount || 0), 0);
            const monthlyExpenses = expenses
                .filter(exp => exp.date >= monthStart && exp.date <= monthEnd)
                .reduce((sum, exp) => sum + Number(exp.amount || 0), 0);
            const monthlyBills = bills.reduce((sum, bill) => sum + Number(bill.amount || 0), 0);
            const totalSavings = savingsGoals.reduce((sum, goal) => sum + Number(goal.current || 0), 0);
            const remainingBalance = monthlyIncome - monthlyExpenses - monthlyBills;
            const savingsRate = monthlyIncome > 0 ? ((totalSavings / monthlyIncome) * 100).toFixed(1) : 0;

            const budgetUsed = {};
            expenses
                .filter(exp => exp.date >= monthStart && exp.date <= monthEnd)
                .forEach(exp => {
                    const amount = Number(exp.amount || 0);
                    const category = exp.category || 'Uncategorized';
                    budgetUsed[category] = (budgetUsed[category] || 0) + amount;
                });

            const totalBudgetUsed = Object.values(budgetUsed).reduce((sum, value) => sum + Number(value || 0), 0);
            const totalMonthlyBudget = Object.values(budgets).reduce((sum, value) => sum + Number(value || 0), 0);
            const budgetRemaining = totalMonthlyBudget - totalBudgetUsed;
            const budgetPercentage = totalMonthlyBudget > 0 ? ((totalBudgetUsed / totalMonthlyBudget) * 100).toFixed(1) : 0;

            const expensesByCategory = Object.entries(budgetUsed)
                .map(([name, value]) => ({ name, value: Number(value || 0) }))
                .sort((a, b) => b.value - a.value);

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('en-CA', {
                    style: 'currency',
                    currency: currency,
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(Number(value || 0));
            };

            const formatDate = (date) => {
                return new Date(date).toLocaleDateString('en-CA', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            };

            const SummaryCard = ({ label, value, subtext, icon }) => (
                <div className={`border rounded-lg p-6 transition-all ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                    <div className="flex items-start justify-between">
                        <div className="flex-1">
                            <p className={`text-sm font-medium ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>{label}</p>
                            <p className={`text-2xl font-semibold mt-2 ${darkMode ? 'text-white' : 'text-slate-900'}`}>{value}</p>
                            {subtext && <p className={`text-xs mt-2 ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>{subtext}</p>}
                        </div>
                        {icon && <span className="text-3xl opacity-20">{icon}</span>}
                    </div>
                </div>
            );

            const ProgressBar = ({ value, max, showValue = true }) => {
                const safeMax = Number(max) > 0 ? Number(max) : 1;
                const percentage = (Number(value || 0) / safeMax) * 100;
                let color = '#10b981';
                if (percentage >= 100) color = '#ef4444';
                else if (percentage >= 80) color = '#f59e0b';

                return (
                    <div className="w-full">
                        <div className={`w-full h-2 rounded-full overflow-hidden ${darkMode ? 'bg-slate-700' : 'bg-slate-200'}`}>
                            <div style={{ width: `${Math.min(percentage, 100)}%`, backgroundColor: color }} className="h-full rounded-full transition-all" />
                        </div>
                        {showValue && <p className={`text-xs mt-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>{percentage.toFixed(0)}% used</p>}
                    </div>
                );
            };

            const DashboardView = () => (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <SummaryCard label="Monthly Income" value={formatCurrency(monthlyIncome)} icon="💰" />
                        <SummaryCard label="Expenses" value={formatCurrency(monthlyExpenses)} icon="💸" />
                        <SummaryCard label="Remaining" value={formatCurrency(remainingBalance)} subtext={remainingBalance > 0 ? 'Available this month' : 'Over budget'} icon="✓" />
                    </div>

                    <div className={`border rounded-lg p-6 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                        <h3 className={`text-lg font-semibold mb-4 ${darkMode ? 'text-white' : 'text-slate-900'}`}>Monthly Budget</h3>
                        <div className="space-y-3">
                            <div className="flex items-center justify-between">
                                <span className={`text-sm ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Budget Limit</span>
                                <span className={`font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{formatCurrency(totalMonthlyBudget)}</span>
                            </div>
                            <div className="flex items-center justify-between">
                                <span className={`text-sm ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Spent</span>
                                <span className={`font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{formatCurrency(totalBudgetUsed)}</span>
                            </div>
                            <div className="flex items-center justify-between">
                                <span className={`text-sm ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Remaining</span>
                                <span className={`font-semibold ${budgetRemaining >= 0 ? (darkMode ? 'text-green-400' : 'text-green-600') : (darkMode ? 'text-red-400' : 'text-red-600')}`}>{formatCurrency(budgetRemaining)}</span>
                            </div>
                            <ProgressBar value={totalBudgetUsed} max={totalMonthlyBudget} />
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <SummaryCard label="Total Savings" value={formatCurrency(totalSavings)} icon="🎯" />
                        <SummaryCard label="Savings Rate" value={`${savingsRate}%`} subtext="of monthly income" icon="📈" />
                        <SummaryCard label="Bills" value={formatCurrency(monthlyBills)} icon="📋" />
                    </div>

                    {savingsGoals.length > 0 && (
                        <div className={`border rounded-lg p-6 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <h3 className={`text-lg font-semibold mb-4 ${darkMode ? 'text-white' : 'text-slate-900'}`}>Top Savings Goals</h3>
                            <div className="space-y-4">
                                {savingsGoals.slice(0, 2).map(goal => {
                                    const goalCompletion = goal.target > 0 ? (goal.current / goal.target) * 100 : 0;
                                    return (
                                        <div key={goal.id}>
                                            <div className="flex items-center justify-between mb-2">
                                                <span className={`font-medium ${darkMode ? 'text-white' : 'text-slate-900'}`}>{goal.name}</span>
                                                <span className={`text-sm ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>{goalCompletion.toFixed(0)}%</span>
                                            </div>
                                            <ProgressBar value={goal.current} max={goal.target} showValue={false} />
                                            <p className={`text-xs mt-2 ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>{formatCurrency(goal.current)} of {formatCurrency(goal.target)}</p>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {bills.length > 0 && (
                        <div className={`border rounded-lg p-6 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <h3 className={`text-lg font-semibold mb-4 ${darkMode ? 'text-white' : 'text-slate-900'}`}>Upcoming Bills</h3>
                            <div className="space-y-3">
                                {bills.slice(0, 3).map(bill => (
                                    <div key={bill.id} className={`flex items-center justify-between p-3 rounded ${darkMode ? 'bg-slate-700' : 'bg-slate-50'}`}>
                                        <div className="flex-1">
                                            <p className={`font-medium ${darkMode ? 'text-white' : 'text-slate-900'}`}>{bill.name}</p>
                                            <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Due {bill.dueDate}th</p>
                                        </div>
                                        <span className={`font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{formatCurrency(bill.amount)}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );

            const TransactionsView = () => (
                <div className="space-y-4">
                    <div className="flex gap-2 mb-4 overflow-x-auto pb-2">
                        {['all', 'me', 'spouse', 'joint'].map(member => (
                            <button
                                key={member}
                                onClick={() => setHouseholdMember(member)}
                                className={`px-4 py-2 rounded text-sm font-medium whitespace-nowrap transition-all ${
                                    householdMember === member
                                        ? (darkMode ? 'bg-blue-600 text-white' : 'bg-blue-600 text-white')
                                        : (darkMode ? 'bg-slate-700 text-slate-300 hover:bg-slate-600' : 'bg-slate-200 text-slate-700 hover:bg-slate-300')
                                }`}
                            >
                                {member.charAt(0).toUpperCase() + member.slice(1)}
                            </button>
                        ))}
                    </div>

                    <div className={`border rounded-lg overflow-hidden ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                        <div className={`divide-y ${darkMode ? 'divide-slate-700' : 'divide-slate-200'}`}>
                            {expenses
                                .filter(exp => householdMember === 'all' || exp.member === householdMember)
                                .sort((a, b) => new Date(b.date) - new Date(a.date))
                                .slice(0, 15)
                                .map(exp => (
                                    <div key={exp.id} className={`p-4 flex items-center justify-between hover:${darkMode ? 'bg-slate-700' : 'bg-slate-50'} transition-colors`}>
                                        <div className="flex-1">
                                            <p className={`font-medium ${darkMode ? 'text-white' : 'text-slate-900'}`}>{exp.description}</p>
                                            <p className={`text-sm ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>{exp.category} • {formatDate(exp.date)}</p>
                                        </div>
                                        <span className={`font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>-{formatCurrency(exp.amount)}</span>
                                    </div>
                                ))}
                        </div>
                    </div>
                </div>
            );

            const BudgetView = () => (
                <div className="space-y-4">
                    <div className="grid gap-4">
                        {Object.entries(budgets)
                            .filter(([category]) => Number(budgets[category] || 0) > 0)
                            .map(([category, budget]) => {
                                const spent = budgetUsed[category] || 0;
                                const remaining = Number(budget || 0) - spent;
                                const percentage = Number(budget || 0) > 0 ? (spent / Number(budget || 0)) * 100 : 0;

                                return (
                                    <div key={category} className={`border rounded-lg p-4 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                        <div className="flex items-center justify-between mb-3">
                                            <span className={`font-medium ${darkMode ? 'text-white' : 'text-slate-900'}`}>{category}</span>
                                            <span className={`text-sm font-semibold ${percentage >= 100 ? (darkMode ? 'text-red-400' : 'text-red-600') : (percentage >= 80 ? (darkMode ? 'text-amber-400' : 'text-amber-600') : (darkMode ? 'text-green-400' : 'text-green-600'))}`}>
                                                {percentage >= 100 ? `Over ${formatCurrency(spent - Number(budget || 0))}` : `${formatCurrency(remaining)} left`}
                                            </span>
                                        </div>
                                        <ProgressBar value={spent} max={Number(budget || 0)} />
                                        <div className="flex items-center justify-between mt-3 text-xs">
                                            <span className={darkMode ? 'text-slate-400' : 'text-slate-600'}>{formatCurrency(spent)} / {formatCurrency(Number(budget || 0))}</span>
                                            <span className={darkMode ? 'text-slate-500' : 'text-slate-500'}>{percentage.toFixed(0)}% used</span>
                                        </div>
                                    </div>
                                );
                            })}
                    </div>
                </div>
            );

            const AnalyticsView = () => (
                <div className="space-y-6">
                    {expensesByCategory.length > 0 && (
                        <div className={`border rounded-lg p-6 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <h3 className={`text-lg font-semibold mb-4 ${darkMode ? 'text-white' : 'text-slate-900'}`}>Top Spending Categories</h3>
                            <div className="space-y-3">
                                {expensesByCategory.slice(0, 5).map((item, index) => (
                                    <div key={item.name} className="flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <span className={`inline-flex items-center justify-center w-8 h-8 rounded-full text-white text-sm font-semibold`} style={{ backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ef4444'][index % 5] }}>
                                                {item.name.charAt(0).toUpperCase()}
                                            </span>
                                            <span className={darkMode ? 'text-white' : 'text-slate-900'}>{item.name}</span>
                                        </div>
                                        <span className={`font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{formatCurrency(item.value)}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );

            const SavingsGoalsView = () => (
                <div className="space-y-4">
                    {savingsGoals.length > 0 ? (
                        savingsGoals.map(goal => {
                            const percentComplete = goal.target > 0 ? (goal.current / goal.target) * 100 : 0;
                            const remaining = goal.target - goal.current;
                            const daysLeft = Math.max(0, Math.ceil((new Date(goal.targetDate) - new Date()) / (1000 * 60 * 60 * 24)));

                            return (
                                <div key={goal.id} className={`border rounded-lg p-6 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                    <div className="flex items-start justify-between mb-4">
                                        <div>
                                            <h3 className={`text-lg font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{goal.name}</h3>
                                            <p className={`text-sm ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Target: {formatDate(goal.targetDate)}</p>
                                        </div>
                                        <span className={`text-2xl font-bold ${darkMode ? 'text-blue-400' : 'text-blue-600'}`}>{percentComplete.toFixed(0)}%</span>
                                    </div>
                                    <ProgressBar value={goal.current} max={goal.target} showValue={false} />
                                    <div className="grid grid-cols-3 gap-4 mt-4 pt-4" style={{ borderTop: `1px solid ${darkMode ? '#334155' : '#e5e7eb'}` }}>
                                        <div>
                                            <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Current</p>
                                            <p className={`font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{formatCurrency(goal.current)}</p>
                                        </div>
                                        <div>
                                            <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Remaining</p>
                                            <p className={`font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{formatCurrency(remaining)}</p>
                                        </div>
                                        <div>
                                            <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Days Left</p>
                                            <p className={`font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{daysLeft}</p>
                                        </div>
                                    </div>
                                </div>
                            );
                        })
                    ) : (
                        <div className={`border rounded-lg p-8 text-center ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <p className={darkMode ? 'text-slate-400' : 'text-slate-600'}>No savings goals yet</p>
                        </div>
                    )}
                </div>
            );

            const SettingsView = () => (
                <div className="space-y-6 max-w-2xl">
                    <div className={`border rounded-lg p-6 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                        <h3 className={`text-lg font-semibold mb-4 ${darkMode ? 'text-white' : 'text-slate-900'}`}>Appearance</h3>
                        <div className="flex items-center justify-between">
                            <span className={darkMode ? 'text-white' : 'text-slate-900'}>Dark Mode</span>
                            <button onClick={() => setDarkMode(!darkMode)} className={`w-12 h-7 rounded-full transition-all relative ${darkMode ? 'bg-blue-600' : 'bg-slate-300'}`}>
                                <div className={`w-6 h-6 bg-white rounded-full absolute top-0.5 transition-all ${darkMode ? 'right-0.5' : 'left-0.5'}`} />
                            </button>
                        </div>
                    </div>

                    <div className={`border rounded-lg p-6 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                        <h3 className={`text-lg font-semibold mb-4 ${darkMode ? 'text-white' : 'text-slate-900'}`}>Data</h3>
                        <button onClick={() => {
                            const dataStr = JSON.stringify({ income, expenses, bills, savingsGoals, budgets }, null, 2);
                            const dataBlob = new Blob([dataStr], { type: 'application/json' });
                            const url = URL.createObjectURL(dataBlob);
                            const link = document.createElement('a');
                            link.href = url;
                            link.download = `budget-backup-${new Date().toISOString().split('T')[0]}.json`;
                            link.click();
                        }} className="w-full px-4 py-2 rounded font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors">
                            Export Data
                        </button>
                        <button onClick={loadDemoData} className={`w-full mt-3 px-4 py-2 rounded font-medium transition-colors ${darkMode ? 'bg-slate-700 text-white hover:bg-slate-600' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}`}>
                            Reset to Demo Data
                        </button>
                    </div>
                </div>
            );

            return (
                <div className={`min-h-screen transition-colors ${darkMode ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-900'}`}>
                    <header className={`border-b sticky top-0 z-50 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between mb-4">
                                <h1 className={`text-2xl font-bold ${darkMode ? 'text-white' : 'text-slate-900'}`}>💰 Budget Tracker</h1>
                                <button onClick={() => setDarkMode(!darkMode)} className={`p-2 rounded-lg transition-colors ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-slate-100 hover:bg-slate-200'}`}>
                                    {darkMode ? '☀️' : '🌙'}
                                </button>
                            </div>
                            <div className="flex gap-1 overflow-x-auto pb-2">
                                {[
                                    { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                                    { id: 'transactions', label: 'Transactions', icon: '📝' },
                                    { id: 'budget', label: 'Budget', icon: '📋' },
                                    { id: 'savings', label: 'Savings', icon: '🎯' },
                                    { id: 'analytics', label: 'Analytics', icon: '📈' },
                                    { id: 'settings', label: 'Settings', icon: '⚙️' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap transition-all text-sm ${
                                            activeTab === tab.id
                                                ? (darkMode ? 'bg-blue-600 text-white' : 'bg-blue-600 text-white')
                                                : (darkMode ? 'text-slate-400 hover:text-white hover:bg-slate-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100')
                                        }`}
                                    >
                                        {tab.icon} {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    {activeTab !== 'settings' && (
                        <div className={`border-b ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-center gap-4">
                                <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1))} className={`px-3 py-1 rounded transition-colors ${darkMode ? 'bg-slate-700 text-white hover:bg-slate-600' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                    ←
                                </button>
                                <span className="font-semibold min-w-[200px] text-center">{currentMonth.toLocaleDateString('en-CA', { month: 'long', year: 'numeric' })}</span>
                                <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1))} className={`px-3 py-1 rounded transition-colors ${darkMode ? 'bg-slate-700 text-white hover:bg-slate-600' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                    →
                                </button>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-8">
                        {activeTab === 'dashboard' && <DashboardView />}
                        {activeTab === 'transactions' && <TransactionsView />}
                        {activeTab === 'budget' && <BudgetView />}
                        {activeTab === 'savings' && <SavingsGoalsView />}
                        {activeTab === 'analytics' && <AnalyticsView />}
                        {activeTab === 'settings' && <SettingsView />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BudgetTrackerApp />);
    </script>
</body>
</html>
